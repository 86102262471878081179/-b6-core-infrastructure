[package]
name = "black_six_kernel_core"
version = "2.1.0"
edition = "2021"
authors = ["Thomas König / ODIN ULTRA ROOT <odin@black-six.matrix>"]
description = "Black Six Matrix Core: Tensor Engine, BILA ISA & PQC WORM Ledger"
license = "Proprietary-B6-Sovereign"

[dependencies]
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "b6_core"
path = "src/lib.rs"

[[bin]]
name = "b6_kernel_node"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
